<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiro Linktree</title>
    <link rel="stylesheet" href="style.css">
    <!-- ceci est ton favicon : la petite image dans l'onglet -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/rabbitude.png">
</head>

<body>



    <!--  HEADER SECTION  -->
    <a href="#main-content" class="skip-link">Passer au contenu principal</a>  <!-- lien d'évitement en début de page pour les users clavier / ce qui les amènent directement à la section main -->
    <header>
        <h1 class="header-brand-title">
            <a href="index.html">
                <span class="header-brand-title-letter-italic" aria-hidden="true">/-/</span><span class="visually-hidden">Hiro</span><span aria-hidden="true">iro</span> Rabbit
            </a> <!-- aria-hidden="true" pour éviter que les lecteurs d'écran ne prononcent ces caractères de manière confuse. -->
        </h1>
        <div class="header-avatar-container" aria-hidden="true">
            <img src="./assets/images/baboon.png" alt="" class="header-avatar"> <!-- dans mon cas, cette image est purement décorative. J'utilise donc l'attribut alt vide pour signaler explicitement aux technologies d'assistance (lecteurs d'écran) qu'elle doit être ignorée -->
            <!-- la combinaison (alt="" + aria-hidden="true") crée une redondance intentionnelle qui garantit que l'image sera correctement ignorée par toutes les technologies d'assistance, même celles qui pourraient avoir des comportements particuliers avec l'un ou l'autre de ces attributs. -->
        </div>
    </header>


    <!--  MAIN SECTION  -->
    <main id="main-content">
        <div class="links-container" role="navigation" aria-label="Liens vers réseaux sociaux">
            <a href="https://www.linkedin.com/in/vic-th0r-6aa023100/" target="_blank" rel="noopener noreferrer"
                class="btn" aria-label="LinkedIn - Ouvre dans un nouvel onglet">
                Linkedin <span aria-hidden="true"> <span class="visually-hidden"> S'ouvre dans un nouvel onglet</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        class="btn-arrow-icon" aria-hidden="true" focusable="false">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            d="M12.013 21L12 3.211m7 6.777L12 3L5 9.988" stroke-width="1" />
                    </svg>
                </span>
            </a>

            <a href="https://github.com/AstroNerf" target="_blank" rel="noopener noreferrer" class="btn"
                aria-label="Github - Ouvre dans un nouvel onglet">
                Github <span aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        class="btn-arrow-icon" aria-hidden="true" focusable="false">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            d="M12.013 21L12 3.211m7 6.777L12 3L5 9.988" stroke-width="1" />
                    </svg>
                </span>
            </a>

            <a href="https://www.malt.fr/profile/victhor" target="_blank" rel="noopener noreferrer" class="btn liquid"
                aria-label="Malt - Ouvre dans un nouvel onglet">
                Hire Me <span aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        class="btn-arrow-icon" aria-hidden="true" focusable="false">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            d="M12.013 21L12 3.211m7 6.777L12 3L5 9.988" stroke-width="1" />
                    </svg>
                </span>
            </a>
        </div>

        <!--  ASIDE NAVBAR SECTION : Burger button & icons animation -->
        <div class="menu-toggle">
            <!-- La checkbox reste invisible mais focusable -->
            <input type="checkbox" id="menu-checkbox" class="menu-checkbox" aria-expanded="false"
                aria-controls="menu-icons-container">
            <!-- aria-expanded sur la checkbox indique l'état du menu (ouvert/fermé) // aria-controls établit la relation entre le contrôle et ce qu'il affecte -->


            <label for="menu-checkbox" class="burger-btn" aria-label="Ouvrir le menu des réseaux sociaux">
                <!-- aria-label sur les liens fournit des descriptions claires aux lecteurs d'écran -->
                <svg xmlns="http://www.w3.org/2000/svg" width="1.9em" height="1.9em" viewBox="0 0 48 48"
                    aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        d="M5.5 24h37m-37 13h37m-37-26h37" stroke-width="1" />
                </svg>
            </label>


            <div id="menu-icons-container" class="menu-icons">
                <!-- Le container à une id pour être référencé par aria-controls -->
                <a href="https://joinmastodon.org/about" target="_blank" rel="noopener noreferrer" class="icon-circle"
                    aria-label="Mastodon - Ouvre dans un nouvel onglet">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="1.9em" height="1.9em"
                        viewBox="0 0 24 24">
                        <g fill="none" stroke="#515251" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="1.5">
                            <path d="M7 13.5V9c0-3 5-3 5 0v3m5 1.5V9c0-3-5-3-5 0v3" />
                            <path
                                d="M8 17c7.5 1 13 0 13-4V9c0-5.5-4-6.5-6-6.5H9c-3 0-6.067 1-5.863 6.5c.074 1.987.036 4.385.363 7c1 8 10.5 5.5 12 5v-1.5S7.5 21 8 17" />
                        </g>
                    </svg>
                </a>
                <a href="https://element.io/" target="_blank" rel="noopener noreferrer" class="icon-circle"
                    aria-label="Element - Ouvre dans un nouvel onglet">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="1.9em" height="1.9em"
                        viewBox="0 0 24 24">
                        <path fill="#515251"
                            d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12s12-5.373 12-12S18.627 0 12 0m-1.314 4.715c3.289 0 5.956 2.66 5.956 5.943a.879.879 0 0 1-1.758 0a4.194 4.194 0 0 0-4.198-4.189a.878.878 0 1 1 0-1.754m-5.092 9.504a.88.88 0 0 1-.879-.877a5.95 5.95 0 0 1 5.956-5.945a.878.878 0 1 1 0 1.753a4.195 4.195 0 0 0-4.198 4.191a.88.88 0 0 1-.879.878m7.735 5.067c-3.29 0-5.957-2.662-5.957-5.944a.88.88 0 0 1 1.758 0a4.194 4.194 0 0 0 4.199 4.189a.879.879 0 1 1 0 1.755m0-2.683a.88.88 0 0 1-.88-.876a.88.88 0 0 1 .88-.878a4.195 4.195 0 0 0 4.199-4.19a.878.878 0 0 1 1.758 0c0 3.282-2.667 5.944-5.957 5.944" />
                    </svg>
                </a>
                <a href="https://briarproject.org/" target="_blank" rel="noopener noreferrer" class="icon-circle"
                    aria-label="Briar Project - Ouvre dans un nouvel onglet">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="1.9em" height="1.9em"
                        viewBox="0 0 48 48">
                        <path fill="none" stroke="#515251" stroke-linecap="round" stroke-linejoin="round"
                            d="M35.32 28.09V8.5a3 3 0 0 0-3-3h-1.21a3 3 0 0 0-3 3v19.59Zm-7.21 7.22v4.19a3 3 0 0 0 3 3h1.21a3 3 0 0 0 3-3v-4.19ZM12.7 28.09H8.51a3 3 0 0 0-3 3v1.22a3 3 0 0 0 3 3h4.19Zm26.81 0H19.92v7.22h19.59a3 3 0 0 0 3-3v-1.22a3 3 0 0 0-3-3m-11.4-15.4H8.51a3 3 0 0 0-3 3v1.22a3 3 0 0 0 3 3h19.6Zm11.4 0h-4.19v7.22h4.19a3 3 0 0 0 3-3v-1.22a3 3 0 0 0-3-3" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            d="M19.92 12.69V8.5a3 3 0 0 0-3-3H15.7a3 3 0 0 0-3 3v4.19Zm-7.22 7.22V39.5a3 3 0 0 0 3 3h1.22a3 3 0 0 0 3-3V19.91Z" />
                    </svg>
                </a>
            </div>
        </div>

        <!--  MAIN BOTTOM SECTION  -->
        <div class="main-bottom-container">
            <div class="main-bottom-content-container">
                <h2>
                    creative web dev
                </h2>
                <h3>
                    the key to your MVP
                </h3>
            </div>
        </div>

        <!--  MAIN BOTTOM ANIMATION  -->
        <div class="matrix-reverse-rain" aria-hidden="true" role="presentation"  tabindex="-1"
        aria-label="Animation décorative">
            <!-- aria-hidden signifie que le texte ne sera pas lu par la liseuse // role="presentation" renforce l'idée que ce contenu est purement visuel // tabindex="-1" garantit qu'il ne sera pas accessible via la navigation au clavier -->

                <span class="char-1">#</span>
                <span class="char-2">#</span>
                <span class="char-3">#</span>
                <span class="char-4">#</span>

            Inspired by
